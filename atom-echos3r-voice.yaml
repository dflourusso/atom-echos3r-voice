# Atom Echo S3R voice satellite — extends M5Stack satellite base
# with Alexa on-device wake word and button-to-talk.

substitutions:
  name: atom-echos3r-voice
  friendly_name: Atom Echo S3R Voice

packages:
  remote_package_files:
    url: https://github.com/m5stack/esphome-yaml
    files: [common/atom-echos3r-satellite-base.yaml]
    ref: main
    refresh: 0s

# Alexa first (default-enabled), keep Okay Nabu + Hey Jarvis, drop Mycroft.
micro_wake_word:
  id: !extend mww
  models:
    - model: alexa
      id: alexa
    - model: ${okay_nabu_model_file}
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: ${stop_model_file}
      id: stop
      internal: true

# Short press: dismiss timer, or start/stop Assist conversation.
# Hold 10s: factory reset (unchanged).
binary_sensor:
  - id: !extend user_button
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:
                      - script.execute: start_wake_word
                    else:
                      - script.execute: stop_wake_word
                      - delay: 100ms
                      - voice_assistant.start:
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

# Sensitivity select must target id(alexa) instead of hey_mycroft.
select:
  - id: !extend wake_word_sensitivity
    on_value:
      # Quantized uint8 cutoffs (float ≈ value/255).
      # Alexa defaults ~0.90; okay_nabu / hey_jarvis match upstream M5Stack package.
      lambda: |-
        if (x == "Slightly sensitive") {
          id(alexa).set_probability_cutoff(230);      // 0.90
          id(okay_nabu).set_probability_cutoff(217);   // 0.85
          id(hey_jarvis).set_probability_cutoff(247);  // 0.97
        } else if (x == "Moderately sensitive") {
          id(alexa).set_probability_cutoff(191);      // 0.75
          id(okay_nabu).set_probability_cutoff(176);   // 0.69
          id(hey_jarvis).set_probability_cutoff(235);  // 0.92
        } else if (x == "Very sensitive") {
          id(alexa).set_probability_cutoff(153);      // 0.60
          id(okay_nabu).set_probability_cutoff(143);   // 0.56
          id(hey_jarvis).set_probability_cutoff(212);  // 0.83
        }
